<!doctype html>
<html lang="ru">
  <head>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta charset="UTF-8" />
    <title>Панель Менеджера</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container">
        <span class="navbar-brand fw-bold">Личный кабинет менеджера</span>
        <a href="index.html" class="btn btn-outline-light btn-sm"
          >Вернуться в каталог</a
        >
      </div>
    </nav>

    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Входящие заказы для обработки</h3>
        <button class="btn btn-danger btn-sm" onclick="clearHistory()">
          Очистить историю заказов
        </button>
      </div>

      <div id="orders-table-container"></div>
    </div>

    <script>
      function renderManagerPanel() {
        const orders = JSON.parse(localStorage.getItem("allOrders")) || [];
        const container = document.getElementById("orders-table-container");

        if (orders.length === 0) {
          container.innerHTML = `
                      <div class="alert alert-secondary text-center py-5">
                          <h5>Заказов пока нет</h5>
                          <p>Оформите заказ в корзине, чтобы он появился здесь.</p>
                      </div>`;
          return;
        }

        container.innerHTML = `
            <table class="table table-bordered bg-white shadow-sm">
                <thead class="table-light">
                    <tr>
                        <th>№</th>
                        <th>Состав заказа</th>
                        <th>Сумма</th>
                        <th>Статус</th>
                        <th>Действие</th>
                    </tr>
                </thead>
                <tbody>
                    ${orders
                      .map((order, index) => {
                        let actionButton = "";
                        let badgeClass = "bg-warning text-dark";

                        if (order.status === "Новый") {
                          actionButton = `<button class="btn btn-sm btn-info w-100" onclick="updateStatus(${index}, 'Принят')">Принять</button>`;
                        } else if (order.status === "Принят") {
                          badgeClass = "bg-info text-dark";
                          actionButton = `<button class="btn btn-sm btn-primary w-100" onclick="updateStatus(${index}, 'В обработке')">В обработку</button>`;
                        } else if (order.status === "В обработке") {
                          badgeClass = "bg-primary";
                          actionButton = `<button class="btn btn-sm btn-success w-100" onclick="updateStatus(${index}, 'Собран')">Собрать</button>`;
                        } else if (order.status === "Собран") {
                          badgeClass = "bg-success";
                          actionButton =
                            '<span class="text-muted small">Готов</span>';
                        }

                        return `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${order.items.map((i) => i.title).join("<br>")}</td>
                            <td class="fw-bold">${order.total}</td>
                            <td><span class="badge ${badgeClass}">${order.status}</span></td>
                            <td>${actionButton}</td>
                        </tr>`;
                      })
                      .join("")}
                </tbody>
            </table>`;
      }
      window.updateStatus = function (index, newStatus) {
        let orders = JSON.parse(localStorage.getItem("allOrders")) || [];
        orders[index].status = newStatus;
        localStorage.setItem("allOrders", JSON.stringify(orders));
        renderManagerPanel();
      };

      window.clearHistory = function () {
        if (confirm("Вы действительно хотите удалить все данные о заказах?")) {
          localStorage.removeItem("allOrders");
          renderManagerPanel();
        }
      };

      renderManagerPanel();
    </script>
  </body>
</html>
