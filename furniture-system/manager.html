<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Панель Менеджера</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
      <div class="container">
        <span class="navbar-brand fw-bold">Личный кабинет менеджера</span>
        <!-- Проверь, чтобы имя index.html было таким же, как твой файл с товарами -->
        <a href="index.html" class="btn btn-outline-light btn-sm"
          >Вернуться в каталог</a
        >
      </div>
    </nav>

    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3>Входящие заказы для обработки</h3>
        <button class="btn btn-danger btn-sm" onclick="clearHistory()">
          Очистить историю заказов
        </button>
      </div>

      <div id="orders-table-container">
        <!-- Здесь появятся заказы после того, как ты оформишь их в корзине -->
      </div>
    </div>

    <script>
      function renderManagerPanel() {
        // Берем заказы из памяти (allOrders)
        const orders = JSON.parse(localStorage.getItem("allOrders")) || [];
        const container = document.getElementById("orders-table-container");

        if (orders.length === 0) {
          container.innerHTML = `
                    <div class="alert alert-secondary text-center py-5">
                        <h5>Заказов пока нет</h5>
                        <p>Оформите заказ в корзине, чтобы он появился здесь.</p>
                    </div>`;
          return;
        }

        container.innerHTML = `
                <table class="table table-bordered bg-white shadow-sm">
                    <thead class="table-light">
                        <tr>
                            <th>№</th>
                            <th>Дата и время</th>
                            <th>Состав заказа</th>
                            <th>Сумма</th>
                            <th>Текущий статус</th>
                            <th>Действие</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${orders
                          .map(
                            (order, index) => `
                            <tr>
                                <td>${index + 1}</td>
                                <td>${order.date}</td>
                                <td>${order.items.map((i) => `• ${i.title}`).join("<br>")}</td>
                                <td class="fw-bold text-primary">${order.total}</td>
                                <td>
                                    <span class="badge ${order.status === "Новый" ? "bg-warning text-dark" : "bg-success"}">
                                        ${order.status}
                                    </span>
                                </td>
                                <td>
                                    ${
                                      order.status === "Новый"
                                        ? `<button class="btn btn-success btn-sm w-100" onclick="processOrder(${index})">Принять в работу</button>`
                                        : '<span class="text-muted small">Заказ принят</span>'
                                    }
                                </td>
                            </tr>
                        `,
                          )
                          .join("")}
                    </tbody>
                </table>`;
      }

      // Эта функция меняет статус заказа
      window.processOrder = function (index) {
        let orders = JSON.parse(localStorage.getItem("allOrders"));
        orders[index].status = "Принят менеджером";
        localStorage.setItem("allOrders", JSON.stringify(orders));
        renderManagerPanel(); // Перерисовываем таблицу
      };

      window.clearHistory = function () {
        if (confirm("Вы действительно хотите удалить все данные о заказах?")) {
          localStorage.removeItem("allOrders");
          renderManagerPanel();
        }
      };

      // ЗАПУСК: Отрисовываем таблицу сразу при загрузке страницы
      renderManagerPanel();
    </script>
  </body>
</html>
